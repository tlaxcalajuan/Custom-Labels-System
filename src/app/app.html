<!-- Header with gradient background and primary navigation -->
<style>
  :host {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: block;
    min-height: 100dvh;
  }
  * { box-sizing: inherit; }
  body { margin: 0; padding: 0; min-height: 100vh; }
  header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    padding: 18px 40px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 26px; font-weight: 600; }
  header nav {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  header nav a {
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }
  header nav a:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
  header nav a.is-active {
    background: rgba(255, 255, 255, 0.9);
    color: #4f46e5;
  }
  main { padding: 40px 20px; min-height: calc(100vh - 80px); }

  /* Tablet: header más compacto. */
  @media (max-width: 960px) {
    header { padding: 16px 24px; }
    header h1 { font-size: 22px; }
    main { padding: 24px 16px; }
  }

  /* Móvil: header en dos filas y padding más ajustado. */
  @media (max-width: 640px) {
    header {
      padding: 14px 16px;
      gap: 10px;
    }
    header h1 { font-size: 18px; flex: 1 1 100%; }
    header nav { width: 100%; }
    header nav a {
      padding: 6px 12px;
      font-size: 13px;
    }
    main { padding: 16px 12px; }
  }

  @media print {
    :host { height: auto; min-height: 0; }
    header { display: none; }
    main { padding: 0; min-height: 0; }
  }
</style>
<header>
  <h1>{{ title() }}</h1>
  <nav aria-label="Secciones principales">
    <a
      routerLink="/labels"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Editor</a
    >
    <a routerLink="/labels/catalog" routerLinkActive="is-active">Catálogo</a>
  </nav>
</header>
<main><router-outlet /></main>
<app-toast-host />
